[project]
name = "luna"
version = "0.1.0"
description = "Your coder — an opencode-style CLI coding assistant"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.1",
    "prompt-toolkit>=3.0.43",
    "tiktoken>=0.7.0",
    "pyperclip>=1.8.2",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Core providers (pick one or more)
nvidia = []  # Uses httpx from core
local = []   # Uses httpx from core
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.30.0"]

# Features
bridge = ["aiohttp>=3.9.1"]           # Bridge server
sessions = ["sqlalchemy>=2.0.0", "aiosqlite>=0.19.0"]  # SQLite sessions
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
yaml = ["pyyaml>=6.0.0"]              # YAML config (optional, TOML is default)
anyio = ["anyio>=4.0.0"]              # Anyio support

# Meta groups
full = ["nvidia", "local", "openai", "anthropic", "bridge", "sessions", "observability", "yaml", "anyio"]
minimal = []  # Just core deps
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "httpx-mock>=0.2.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "session*", "bridge*", "ui*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Plugin entry points
[project.entry-points."luna.plugins"]
# Example: my_plugin = "my_package.plugin:MyPlugin"
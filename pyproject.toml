[project]
name = "luna"
version = "0.1.0"
description = "Your coder — an opencode-style CLI coding assistant"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.1",
    "prompt-toolkit>=3.0.53",
    "aiohttp>=3.9.1",
    "tiktoken>=0.7.0",
    "anyio>=4.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.0",
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx-mock>=0.2.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "session*", "bridge*", "ui*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true